name: Build & Release APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-34 build-tools;34.0.0' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Siapkan keystore
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KSPW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +e
          if [ -z "$KS" ]; then
            echo "::warning::Secret KEYSTORE_B64 belum diisi. APK memakai kunci debug acak, jadi update dari versi sebelumnya tidak bisa dipasang."
            exit 0
          fi
          printf '%s' "$KS" | tr -d ' \n\r\t' | base64 -d > "$RUNNER_TEMP/update.jks" 2>/dev/null
          if [ $? -ne 0 ] || [ ! -s "$RUNNER_TEMP/update.jks" ]; then
            echo "::warning::Isi secret KEYSTORE_B64 bukan base64 yang valid. Salin ulang HANYA hasil perintah base64 dari update.jks (satu baris panjang). Build memakai kunci debug."
            exit 0
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/update.jks" -storepass "$KSPW" -alias key0 > /dev/null 2>&1; then
            echo "::warning::Keystore terbaca, tetapi KEYSTORE_PASSWORD salah atau alias bukan key0. Build memakai kunci debug."
            exit 0
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/update.jks" >> "$GITHUB_ENV"
          echo "Keystore valid, APK akan ditandatangani dengan kunci tetap."
      - name: Periksa struktur project (perbaiki otomatis konfigurasi Gradle jika salah)
        shell: bash
        run: |
          echo "--- Mengonfigurasi otomatis file Gradle agar 100% valid ---"
          # 1. Pastikan root build.gradle.kts memiliki plugin dengan versi (apply false)
          cat > build.gradle.kts <<'ROOT_GRADLE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
          }
          ROOT_GRADLE

          # 2. Pastikan settings.gradle.kts memiliki repository dan include :app
          cat > settings.gradle.kts <<'SETTINGS_GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PemantauTugas"
          include(":app")
          SETTINGS_GRADLE

          # 3. Pastikan gradle.properties ada
          cat > gradle.properties <<'GRADLE_PROP'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g
          GRADLE_PROP

          # 4. Pastikan app/build.gradle.kts adalah modul aplikasi Android yang valid
          mkdir -p app
          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          val verCode = (project.findProperty("verCode") as String?)?.toIntOrNull() ?: 1
          val repoSlug = (project.findProperty("repoSlug") as String?) ?: ""
          val ksPath: String? = System.getenv("KEYSTORE_PATH")

          android {
              namespace = "id.pemantau.tugas"
              compileSdk = 34
              defaultConfig {
                  applicationId = "id.pemantau.tugas"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = verCode
                  versionName = "1.$verCode"
                  resValue("string", "repo_slug", repoSlug)
              }
              signingConfigs {
                  if (ksPath != null && file(ksPath).exists()) {
                      create("ci") {
                          storeFile = file(ksPath)
                          storePassword = System.getenv("KEYSTORE_PASSWORD")
                          keyAlias = "key0"
                          keyPassword = System.getenv("KEYSTORE_PASSWORD")
                      }
                  }
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.findByName("ci") ?: signingConfigs.getByName("debug")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              lint { abortOnError = false; checkReleaseBuilds = false }
          }
          dependencies { implementation("androidx.work:work-runtime-ktx:2.9.1") }
          GRADLE

          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            echo "::error::app/src/main/AndroidManifest.xml tidak ada. Pastikan isi folder app/src sudah ikut di-push."
            exit 1
          fi
          echo "Konfigurasi Gradle siap untuk build."
      - name: Build APK (diulang hanya jika unduhan dependency gagal karena jaringan)
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +e
          for i in 1 2 3; do
            gradle assembleRelease -PverCode=${{ github.run_number }} -PrepoSlug=${{ github.repository }} --no-daemon --stacktrace --console=plain 2>&1 | tee build.log
            code=${PIPESTATUS[0]}
            [ "$code" -eq 0 ] && exit 0
            if grep -q -E "Could not (resolve|GET|HEAD)|Connection (reset|timed out)|Read timed out|Premature end|Received status code 5" build.log; then
              echo "::warning::Build gagal karena jaringan pada percobaan $i dari 3. Mengulang dalam 30 detik..."
              sleep 30
            else
              echo "::error::Build gagal (bukan masalah jaringan), jadi tidak diulang. Lihat pesan error di atas."
              exit "$code"
            fi
          done
          exit 1
      - run: cp app/build/outputs/apk/release/app-release.apk PemantauTugas.apk
      - uses: actions/upload-artifact@v4
        with: { name: PemantauTugas-APK, path: PemantauTugas.apk }
      - name: Terbitkan rilis (dibaca oleh fitur update di aplikasi)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "v${{ github.run_number }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v${{ github.run_number }}" PemantauTugas.apk --title "Versi ${{ github.run_number }}" --notes "$(git log -1 --pretty=%B)" --latest
