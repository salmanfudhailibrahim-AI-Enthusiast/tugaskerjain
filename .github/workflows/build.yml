name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platforms;android-34 build-tools;34.0.0' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug --no-daemon --stacktrace --console=plain
      - uses: actions/upload-artifact@v4
        with: { name: PemantauTugas-APK, path: app/build/outputs/apk/debug/app-debug.apk }
